name: Publication du site (branche deploy)

# À chaque fusion sur main, le contenu de site/ est publié tel quel dans la branche "deploy".
# OVH (intégration Git de l'hébergement) récupère cette branche et met le site en ligne.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publier site/ dans la branche deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd site
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site publié depuis ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
