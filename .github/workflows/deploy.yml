name: Publication du site (branche deploy)

# À chaque fusion sur main, le contenu de site/ est publié dans la branche "deploy".
# OVH (intégration Git de l'hébergement) récupère cette branche et met le site en ligne.
# L'historique de "deploy" est linéaire (un commit ajouté à chaque publication) : OVH fait un "git pull".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publier site/ dans la branche deploy
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          SITE_DIR: ${{ github.workspace }}/site
          # Dernier commit de "deploy" connu d'OVH avant la correction de l'historique (à retirer plus tard).
          REPAIR_BASE: 9480e9b82245a605cb1a39e0eb7b010c271e26b0
        run: bash .github/scripts/publish-deploy.sh
